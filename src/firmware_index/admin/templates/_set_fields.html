<div class="fields">
  <div class="field"><label>Model</label><input type="text" name="s_modelId"></div>
  <div class="field wide"><label>Manufacturer names</label><input type="text" name="s_manufacturerName" placeholder="Comma-separated"></div>
  <div class="field"><label>Lowest version it updates</label><input type="text" name="s_minFileVersion" placeholder="0x..."></div>
  <div class="field"><label>Highest version it updates</label><input type="text" name="s_maxFileVersion" placeholder="0x..."></div>
  <div class="field"><label>Lowest hardware</label><input type="text" name="s_hardwareVersionMin"></div>
  <div class="field"><label>Highest hardware</label><input type="text" name="s_hardwareVersionMax"></div>
  <div class="field wide"><label>Header string</label><input type="text" name="s_otaHeaderString"></div>
  <div class="field full"><label>Release notes</label><textarea name="s_releaseNotes"></textarea></div>
</div>
<p class="hint">Only the fields you fill in change. Numbers may be decimal or hex (0x...).</p>
